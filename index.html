<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gewohnheiten">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Meine Gewohnheiten</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20231f;background:#f7f7f2;font-synthesis:none;--green:#4b8068;--line:#e6e8df;--muted:#7c8178;--card:#fff;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding-bottom:calc(24px + var(--safe-bottom))}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 5px}h1{font-size:29px;letter-spacing:-.04em;margin:0}.today{margin:7px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px}.icon-button,.back{border:1px solid var(--line);background:white;border-radius:14px;padding:11px 13px;color:#30342f;font-weight:650}.primary{border:0;background:#263c33;color:white;border-radius:14px;padding:13px 16px;font-weight:700}.toolbar{display:flex;gap:9px;margin:22px 0 16px}.toolbar button{flex:1}.habit-list{display:grid;gap:11px}.habit-card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 8px #20231f05}.habit-open{min-width:0;flex:1;display:flex;align-items:center;gap:12px;border:0;padding:0;background:transparent;text-align:left;color:inherit}.badge{height:46px;width:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none}.habit-copy{min-width:0}.habit-name{font-weight:700;font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.habit-meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.check{width:48px;height:48px;border:2px solid #d7dbd2;border-radius:16px;background:white;color:white;font-size:21px;font-weight:800;flex:none}.check.done{border-color:var(--habit);background:var(--habit)}.empty{padding:35px 22px;text-align:center;color:var(--muted);background:white;border:1px dashed #d8ddd3;border-radius:20px;line-height:1.55}.detail-head{display:flex;align-items:center;gap:12px;margin:24px 0 20px}.detail-head h2{font-size:23px;margin:0}.detail-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:17px;margin:12px 0}.panel h3{font-size:16px;margin:0 0 14px}.month-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.month-controls strong{text-transform:capitalize}.month-controls button{border:0;background:#f4f5ef;border-radius:10px;padding:8px 12px}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(32px,auto);gap:5px;text-align:center;align-items:center}.weekday{display:grid;place-items:center;min-height:26px;font-size:11px;color:var(--muted);padding:3px 0}.day{width:100%;min-height:32px;aspect-ratio:1;border:0;border-radius:10px;background:#f0f1ed;color:#383d37;font-size:13px;position:relative}.day.out{visibility:hidden}.day.done{background:var(--habit);color:white;font-weight:750}.day.today{outline:2px solid #273d33;outline-offset:1px}.day.future{opacity:.4}.legend{display:block;clear:both;position:relative;line-height:1.45;font-size:12px;color:var(--muted);margin:16px 0 0}.heat-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding:2px 0 8px;scrollbar-width:thin}.heatmap{display:flex;gap:5px;min-width:max-content;direction:rtl}.week{display:grid;grid-template-rows:repeat(7,13px);gap:4px}.cell{height:13px;width:13px;border-radius:3px;background:#e8eae5}.cell.done{background:var(--habit)}.heat-labels{display:flex;direction:rtl;gap:5px;margin-top:6px;color:var(--muted);font-size:10px}.heat-label{width:13px}.panel-note{color:var(--muted);font-size:12px;margin:10px 0 0}.detail-actions{display:flex;gap:8px;margin:15px 0}.danger{color:#a73939}.modal-backdrop{position:fixed;inset:0;background:#17231dcc;display:grid;align-items:start;overflow-y:auto;overscroll-behavior:contain;z-index:3;padding:calc(15px + env(safe-area-inset-top,0px)) 15px calc(15px + var(--safe-bottom))}.modal{background:#fff;border-radius:23px;padding:22px;max-width:520px;width:100%;max-height:calc(100vh - 30px - env(safe-area-inset-top,0px) - var(--safe-bottom));max-height:calc(100dvh - 30px - env(safe-area-inset-top,0px) - var(--safe-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 auto}.modal h2{font-size:21px;margin:0 0 18px}.field{display:block;font-weight:650;font-size:13px;margin:14px 0}.field input,.field select{display:block;width:100%;margin-top:7px;border:1px solid #dfe2d9;border-radius:12px;padding:12px;background:#fff}.color-row{display:flex;align-items:center;gap:10px}.color-row input{width:48px;height:42px;padding:3px}.emoji-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;max-height:180px;overflow-y:auto;overscroll-behavior:contain;padding:2px;-webkit-overflow-scrolling:touch}.emoji-choice{height:40px;width:42px;flex:0 0 42px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:21px}.emoji-choice.selected{border:2px solid var(--green);background:#f0f6f0}.modal-actions{display:flex;gap:9px;margin-top:20px}.modal-actions button{flex:1}.toast{position:fixed;bottom:calc(18px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:#263c33;color:#fff;padding:11px 16px;border-radius:99px;font-size:13px;z-index:5;box-shadow:0 4px 16px #0002}.hidden{display:none!important}.install-tip{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}@media(min-width:600px){.shell{padding-top:36px}.modal-backdrop{align-items:center}.week{grid-template-rows:repeat(7,15px)}.cell{height:15px;width:15px}}
  </style>
</head>
<body>
<main class="shell" id="app"></main>
<div id="overlay"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{
 const KEY='habit-tracker-v1', colors=['#4b8068','#4774b8','#b56e3d','#8b65ad','#c44e62','#308b91','#a68b35','#667080'], emojis=['💧','📚','🏃','🧘','💊','✍️','🥗','🌱','🎸','🛌','☀️','🚶','🧹','💻','❤️','⭐','🧠','🦷','🧴','🧺','🧼','🚴','🏊','🕺','🐕','🐈','🍎','🥦','☕','🫖','🙏','🎨','🎹','🎧','📖','📝','🧑‍🍳','🥤','🍵','🌿','🌼','🪴','🌙','⏰','📵','🧹','🧽','🧘‍♀️','🏋️','⚽','🏸','🧩','🪙','💰','🛁','🧵','🛠️','🚿','🧑‍💻','🫁','🕯️','🎯','📷','🏠'];
 const $=s=>document.querySelector(s), app=$('#app'), overlay=$('#overlay');let data=load(),page='home',activeId=null,monthOffset=0,toastTimer;
 function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.habits))return x}catch{}return{habits:[]}}
 function save(){localStorage.setItem(KEY,JSON.stringify(data))}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function today(){return dateKey(new Date())}function fromKey(k){return new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))}function fmt(d,opt={day:'numeric',month:'long',year:'numeric'}){return new Intl.DateTimeFormat('de-DE',opt).format(d)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function habit(id=activeId){return data.habits.find(h=>h.id===id)}function count(h){return Object.values(h.days).filter(Boolean).length}function streak(h){let d=new Date();let k=dateKey(d);if(!h.days[k])d.setDate(d.getDate()-1);let n=0;while(h.days[dateKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
 function showToast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2200)}
 function render(){if(page==='home')home();else detail()}
 function home(){const date=fmt(new Date(),{weekday:'long',day:'numeric',month:'long'});app.innerHTML=`<header class="top"><div><p class="eyebrow">Dein Tag</p><h1>Gewohnheiten</h1><p class="today">${date}</p></div><div class="actions"><button class="icon-button" id="backup" aria-label="Daten sichern">⇧</button><button class="icon-button" id="restore" aria-label="Sicherung laden">⇩</button></div></header><div class="toolbar"><button class="primary" id="add">＋ Gewohnheit hinzufügen</button></div><section class="habit-list">${data.habits.length?data.habits.map(h=>`<article class="habit-card" style="--habit:${h.color}"><button class="habit-open" data-open="${h.id}"><span class="badge" style="background:${h.color}20">${h.icon}</span><span class="habit-copy"><span class="habit-name">${esc(h.name)}</span><span class="habit-meta">${count(h)} erledigt · ${streak(h)} Tage in Folge</span></span></button><button class="check ${h.days[today()]?'done':''}" style="--habit:${h.color}" data-toggle="${h.id}" aria-label="${h.days[today()]?'Als nicht erledigt markieren':'Als erledigt markieren'}">${h.days[today()]?'✓':''}</button></article>`).join(''):`<div class="empty">Hier beginnt deine Übersicht.<br>Lege deine erste Gewohnheit an und hake sie täglich ab.</div>`}</section><p class="install-tip">Deine Daten bleiben auf diesem Gerät. Sichere sie gelegentlich über ⇧.</p>`;
 $('#add').onclick=()=>editModal();$('#backup').onclick=backup;$('#restore').onclick=()=>$('#fileInput').click();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{activeId=b.dataset.open;page='detail';monthOffset=0;render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle,today()));}
 function detail(){let h=habit();if(!h){page='home';return home()}const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+monthOffset);const first=new Date(base.getFullYear(),base.getMonth(),1),daysIn=new Date(base.getFullYear(),base.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7;const cells=Array.from({length:offset},()=>'<span class="day out"></span>').concat(Array.from({length:daysIn},(_,i)=>{let d=new Date(base.getFullYear(),base.getMonth(),i+1),k=dateKey(d),future=k>today();return `<button class="day ${h.days[k]?'done':''} ${k===today()?'today':''} ${future?'future':''}" data-date="${k}" ${future?'disabled':''}>${i+1}</button>`}));
 let weeks=26, start=new Date();start.setDate(start.getDate()-(weeks*7-1));start.setDate(start.getDate()-((start.getDay()+6)%7));const weekHtml=Array.from({length:weeks},(_,wi)=>{const days=Array.from({length:7},(_,di)=>{let d=new Date(start);d.setDate(start.getDate()+wi*7+di);let k=dateKey(d);return `<span class="cell ${h.days[k]?'done':''}" title="${fmt(d)}${h.days[k]?' · erledigt':''}" style="${h.days[k]?`background:${h.color}`:''}"></span>`}).join('');return `<div class="week">${days}</div>`}).join('');
 app.innerHTML=`<button class="back" id="back">← Übersicht</button><div class="detail-head"><span class="badge" style="background:${h.color}20">${h.icon}</span><div><h2>${esc(h.name)}</h2><p>${count(h)} erledigte Tage · ${streak(h)} Tage in Folge</p></div></div><section class="panel"><div class="month-controls"><button id="prev">←</button><strong>${fmt(base,{month:'long',year:'numeric'})}</strong><button id="next" ${monthOffset>=0?'disabled':''}>→</button></div><div class="month-grid"><span class="weekday">Mo</span><span class="weekday">Di</span><span class="weekday">Mi</span><span class="weekday">Do</span><span class="weekday">Fr</span><span class="weekday">Sa</span><span class="weekday">So</span>${cells.join('')}</div><p class="legend">Tippe auf einen vergangenen Tag, um ihn abzuhaken oder zurückzusetzen.</p></section><section class="panel"><h3>Letzte 26 Wochen</h3><div class="heat-scroll" id="heatScroll"><div class="heatmap">${weekHtml}</div><div class="heat-labels">${Array.from({length:weeks},(_,i)=>i%4===0?`<span class="heat-label">${fmt(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i*7),{month:'short'})}</span>`:'<span class="heat-label"></span>').join('')}</div></div><p class="panel-note">Jede Spalte ist eine Woche, Mo–So von oben nach unten. Die neueste Woche steht links; nach rechts zu älteren Wochen wischen.</p></section><div class="detail-actions"><button class="icon-button" id="edit">Bearbeiten</button><button class="icon-button danger" id="delete">Löschen</button></div>`;
 $('#back').onclick=()=>{page='home';render()};$('#prev').onclick=()=>{monthOffset--;render()};$('#next').onclick=()=>{if(monthOffset<0){monthOffset++;render()}};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>toggle(h.id,b.dataset.date));$('#edit').onclick=()=>editModal(h);$('#delete').onclick=()=>confirmDelete(h);let sc=$('#heatScroll');sc.scrollLeft=sc.scrollWidth;}
 function toggle(id,k){let h=habit(id);if(!h)return;h.days[k]=!h.days[k];if(!h.days[k])delete h.days[k];save();render()}
 function editModal(h=null){let chosen=h?.icon||emojis[0], color=h?.color||colors[0];overlay.innerHTML=`<div class="modal-backdrop" id="shade"><form class="modal" id="habitForm"><h2>${h?'Gewohnheit bearbeiten':'Neue Gewohnheit'}</h2><label class="field">Name<input name="name" maxlength="50" required placeholder="z. B. Lesen" value="${h?esc(h.name):''}"></label><div class="field">Icon<div class="emoji-list">${emojis.map(e=>`<button type="button" class="emoji-choice ${e===chosen?'selected':''}" data-emoji="${e}">${e}</button>`).join('')}</div></div><label class="field">Farbe<div class="color-row"><input type="color" name="color" value="${color}"><span>Diese Farbe markiert erledigte Tage.</span></div></label><div class="modal-actions"><button class="icon-button" type="button" id="cancel">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></div>`;let form=$('#habitForm');form.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{chosen=b.dataset.emoji;form.querySelectorAll('[data-emoji]').forEach(x=>x.classList.toggle('selected',x===b))});$('#cancel').onclick=()=>overlay.innerHTML='';$('#shade').onclick=e=>{if(e.target.id==='shade')overlay.innerHTML=''};form.onsubmit=e=>{e.preventDefault();let name=form.elements.name.value.trim();if(!name)return;if(h){h.name=name;h.icon=chosen;h.color=form.elements.color.value}else data.habits.push({id:crypto.randomUUID(),name,icon:chosen,color:form.elements.color.value,days:{}});save();overlay.innerHTML='';render()};form.elements.name.focus()}
 function confirmDelete(h){overlay.innerHTML=`<div class="modal-backdrop" id="shade"><div class="modal"><h2>„${esc(h.name)}“ löschen?</h2><p style="color:var(--muted)">Dabei werden auch alle gespeicherten Tage dieser Gewohnheit gelöscht.</p><div class="modal-actions"><button class="icon-button" id="cancel">Abbrechen</button><button class="primary" id="yes" style="background:#a73939">Löschen</button></div></div></div>`;$('#cancel').onclick=()=>overlay.innerHTML='';$('#yes').onclick=()=>{data.habits=data.habits.filter(x=>x.id!==h.id);save();overlay.innerHTML='';page='home';render()}}
 function backup(){let blob=new Blob([JSON.stringify({format:'habit-tracker-backup',version:1,exportedAt:new Date().toISOString(),habits:data.habits},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gewohnheiten-sicherung-${today()}.json`;a.click();URL.revokeObjectURL(a.href);showToast('Sicherungsdatei heruntergeladen')}
 function restoreFile(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.format!=='habit-tracker-backup'||!Array.isArray(x.habits))throw 0;if(!confirm(`Sicherung mit ${x.habits.length} Gewohnheiten laden? Deine jetzige Liste wird ersetzt.`))return;data={habits:x.habits};save();render();showToast('Sicherung geladen')}catch{showToast('Diese Datei ist keine passende Sicherung')}};r.readAsText(file)}
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.id='fileInput';input.className='hidden';input.onchange=()=>{if(input.files[0])restoreFile(input.files[0]);input.value=''};document.body.append(input);render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
